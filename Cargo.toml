[package]
name = "coolify-qs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Omarchy Quattro bar widget backend for Coolify deployments"
readme = "README.md"
repository = "https://github.com/LucaNerlich/coolify-qs"
keywords = ["omarchy", "coolify", "deployments", "quickshell"]
categories = ["command-line-utilities"]

[lib]
name = "coolify_qs"
path = "src/lib.rs"

[[bin]]
name = "coolify-qs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-webpki-roots",
    "__rustls-ring",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep the symbol table. Marketplace review inspects this ELF with `nm`;
# `strip = true` or `"symbols"` is a listing rejection.
strip = "debuginfo"
