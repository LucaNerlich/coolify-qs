name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Plugin model tests
        run: node omarchy/model.test.mjs

  msrv:
    name: test (rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85.0

      - name: Check declared minimum Rust version
        run: cargo check --all-targets --locked

  verify-bundle:
    name: verify bundled binary is reproducible (musl)
    runs-on: ubuntu-latest
    needs: [linux, msrv]
    steps:
      - uses: actions/checkout@v4

      # Pin to the toolchain in rust-toolchain.toml so the check reproduces
      # the exact binary that was committed.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-bundle-musl

      - name: Verify bundled binary matches a fresh reproducible build
        run: scripts/verify-bundle.sh
