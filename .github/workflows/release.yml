name: Release

# Re-attests the marketplace bundle requirements on the tagged SHA, then
# publishes the GitHub Release. A skipped or failed verify must not produce
# a release asset for that tag.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only the Publish step needs a token, and release creation is all it
# needs from it.
permissions:
  contents: write

jobs:
  release:
    name: verify bundle and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved or
      # compromised ref cannot obtain the release-writing token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inspect committed ELF
        run: VERIFY_BUNDLE_SKIP_REBUILD=1 scripts/verify-bundle.sh

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-verify-musl

      - name: Marketplace bundle checks
        run: scripts/verify-bundle.sh

      - name: Functional tests
        run: |
          cargo test --all-targets --locked
          node omarchy/model.test.mjs

      - name: Package committed ELF
        run: scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset="dist/coolify-qs-${version}-linux-x86_64.tar.gz"
          notes="$(scripts/changelog-notes.sh "$version")"
          {
            echo "$notes"
            echo
            echo "Artifact: \`$(basename "$asset")\` (statically linked musl x86_64)."
          } > /tmp/release-notes.md
          gh release create "$tag" "$asset" --title "$tag" --notes-file /tmp/release-notes.md
